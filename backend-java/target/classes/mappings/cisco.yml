vendor: CISCO
description: "Cisco ASA / Firewall Log Mapping Rules"
fieldMappings:
  - sourceField: "src_ip"
    targetField: "sourceIp"
    transform: "TRIM"
  - sourceField: "dst_ip"
    targetField: "destinationIp"
    transform: "TRIM"
  - sourceField: "src_port"
    targetField: "sourcePort"
    transform: "TO_INT"
  - sourceField: "dst_port"
    targetField: "destinationPort"
    transform: "TO_INT"
  - sourceField: "action"
    targetField: "action"
    transform: "UPPERCASE"
  - sourceField: "protocol"
    targetField: "protocol"
    transform: "UPPERCASE"
  - sourceField: "user"
    targetField: "user"
    transform: "TRIM"
severityMapping:
  "1": "CRITICAL"
  "2": "HIGH"
  "3": "MEDIUM"
  "4": "LOW"
  "5": "INFO"
