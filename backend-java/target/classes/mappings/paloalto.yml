vendor: PALO_ALTO
description: "Palo Alto Networks Firewall Log Mapping Rules"
fieldMappings:
  - sourceField: "src_ip"
    targetField: "sourceIp"
    transform: "TRIM"
  - sourceField: "dst_ip"
    targetField: "destinationIp"
    transform: "TRIM"
  - sourceField: "src_port"
    targetField: "sourcePort"
    transform: "TO_INT"
  - sourceField: "dst_port"
    targetField: "destinationPort"
    transform: "TO_INT"
  - sourceField: "action"
    targetField: "action"
    transform: "UPPERCASE"
  - sourceField: "proto"
    targetField: "protocol"
    transform: "UPPERCASE"
  - sourceField: "src_user"
    targetField: "user"
    transform: "TRIM"
severityMapping:
  "critical": "CRITICAL"
  "high": "HIGH"
  "medium": "MEDIUM"
  "low": "LOW"
  "informational": "INFO"
