vendor: FORTINET
description: "Fortinet FortiGate Log Mapping Rules"
fieldMappings:
  - sourceField: "srcip"
    targetField: "sourceIp"
    transform: "TRIM"
  - sourceField: "dstip"
    targetField: "destinationIp"
    transform: "TRIM"
  - sourceField: "srcport"
    targetField: "sourcePort"
    transform: "TO_INT"
  - sourceField: "dstport"
    targetField: "destinationPort"
    transform: "TO_INT"
  - sourceField: "action"
    targetField: "action"
    transform: "UPPERCASE"
  - sourceField: "proto"
    targetField: "protocol"
    transform: "MAP_PROTO_NUM"
  - sourceField: "user"
    targetField: "user"
    transform: "TRIM"
severityMapping:
  "emergency": "CRITICAL"
  "alert": "CRITICAL"
  "critical": "CRITICAL"
  "error": "HIGH"
  "warning": "MEDIUM"
  "notice": "LOW"
  "information": "INFO"
