vendor: GENERIC
description: "Generic Syslog & JSON Log Mapping Rules"
fieldMappings:
  - sourceField: "source_ip"
    targetField: "sourceIp"
    transform: "TRIM"
  - sourceField: "dest_ip"
    targetField: "destinationIp"
    transform: "TRIM"
  - sourceField: "source_port"
    targetField: "sourcePort"
    transform: "TO_INT"
  - sourceField: "dest_port"
    targetField: "destinationPort"
    transform: "TO_INT"
  - sourceField: "event_action"
    targetField: "action"
    transform: "UPPERCASE"
  - sourceField: "proto"
    targetField: "protocol"
    transform: "UPPERCASE"
severityMapping:
  "ERR": "HIGH"
  "WARN": "MEDIUM"
  "INFO": "INFO"
  "DEBUG": "INFO"
